<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>《阿含經》白話計畫 · 水藍主題</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="stylesheet" href="lib/themes/vue.css">

  <style>
    /* ══════════════════════════════════════
       全域色彩變數 — 淡水藍色系 (原金色全面換為水藍)
    ══════════════════════════════════════ */
    :root {
      --background:      #000000;
      --base-color:      #b8dcff;        /* 柔和淡水藍 (原 #b59a4d) */
      --theme-color:     #5fc3ff;        /* 主色調：清澈水藍 (原 #d4af37) */
      --theme-light:     #8ad4ff;        /* 較淺的輔助藍 */
      --theme-deep:      #3a9bd5;        /* 深一點的按鈕懸停藍 */
      --base-font-size:  18px;
      --toolbar-height:  52px;
      --my-sidebar-width: 300px;
    }

    /* 全局文字與背景 */
    body, .markdown-section, .markdown-section p, .markdown-section li,
    .markdown-section td, .markdown-section th, .markdown-section blockquote,
    .markdown-section blockquote p, .content, p, li, td, th, span, label {
      color: var(--base-color) !important;
    }
    body { background-color: var(--background); }
    
    /* 標題：一級、二級維持純白，三級標題改為淡水藍（符合「### 是金色 → 水藍」需求） */
    h1, h2, .markdown-section h1, .markdown-section h2 {
      color: #ffffff !important;
    }
    h3, .markdown-section h3 {
      color: var(--theme-color) !important;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    h4, h5, h6, .markdown-section h4, .markdown-section h5, .markdown-section h6 {
      color: #e0f0ff !important;
    }
    
    strong, .markdown-section strong { color: #ffffff !important; }
    
    /* 連結 */
    a, .markdown-section a { color: var(--theme-light) !important; transition: color 0.2s; }
    a:hover, .markdown-section a:hover { color: var(--theme-color) !important; text-shadow: 0 0 2px rgba(95,195,255,0.3); }
    
    /* 程式碼區塊保持舒適色調 */
    .markdown-section code, .markdown-section pre code { color: #c7e9ff !important; background: #111c22 !important; }
    .markdown-section pre { background: #111c22 !important; border: 1px solid #2a4050; }
    
    /* 搜尋元件 */
    .search input { background: #0a1218 !important; color: var(--base-color) !important; border: 1px solid #2a4a6a !important; }
    .search input::placeholder { color: #5f8aaa !important; }
    .search .results-panel { background: #071017 !important; border: 1px solid #2a4a6a !important; }
    .search .results-panel a { border-bottom: 1px solid #1a3343 !important; }
    .search .results-panel .matching-post h2 { color: #ffffff !important; }
    .search .results-panel .matching-post p { color: var(--base-color) !important; }
    .search .results-panel .matching-post .matching-post-title { color: var(--theme-color) !important; }

    /* Docsify-Tabs 元件 (淡水藍主題) */
    .docsify-tabs__tab { background: #0a1218 !important; color: #8ab3cc !important; border: 1px solid #2a4a6a !important; }
    .docsify-tabs__tab--active { background: #000000 !important; color: var(--theme-color) !important; border-bottom: 2px solid var(--theme-color) !important; }
    .docsify-tabs__content { background: #071017 !important; border: 1px solid #2a4a6a !important; color: var(--base-color) !important; }

    /* 表格 */
    .markdown-section table tr { background: #071018 !important; border-top: 1px solid #2a4a6a !important; }
    .markdown-section table tr:nth-child(2n) { background: #0b1720 !important; }
    .markdown-section table th, .markdown-section table td { border: 1px solid #2a4a6a !important; }
    .markdown-section blockquote { border-left: 4px solid var(--theme-color) !important; background: #07121a !important; }

    /* ══════════════════════════════════════
       側邊欄 (自定義 無預設行為)
    ══════════════════════════════════════ */
    .sidebar-toggle { display: none !important; }

    .sidebar {
      position: fixed !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: var(--my-sidebar-width) !important;
      z-index: 1000 !important;
      background-color: #050b0f !important;
      border-right: 1px solid #1a4058 !important;
      transform: translateX(0) !important;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    body.my-sidebar-closed .sidebar { transform: translateX(calc(-1 * var(--my-sidebar-width))) !important; }
    .sidebar-nav li a, .sidebar-nav li span, .sidebar ul li a { color: var(--base-color) !important; }
    .sidebar-nav li.active > a, .sidebar-nav li > a.active { 
      color: var(--theme-color) !important; 
      border-right: 2px solid var(--theme-color);
      background: linear-gradient(90deg, transparent, rgba(95,195,255,0.08));
    }
    .app-name, .app-name a { color: var(--theme-color) !important; font-weight: 500; letter-spacing: 1px; }

    /* 主內容區域切換 */
    .content {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .bottom-toolbar { transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important; }

    @media screen and (min-width: 769px) {
      body .content { left: var(--my-sidebar-width) !important; }
      body.my-sidebar-closed .content { left: 0 !important; }
      body .bottom-toolbar { left: var(--my-sidebar-width) !important; }
      body.my-sidebar-closed .bottom-toolbar { left: 0 !important; }
    }
    @media screen and (max-width: 768px) {
      body .content { left: 0 !important; width: 100% !important; padding-left: 20px !important; }
      body .bottom-toolbar { left: 0 !important; padding: 0 10px !important; gap: 4px !important; }
      .bottom-toolbar button { padding: 6px 8px !important; font-size: 12px !important; }
    }

    /* ══════════════════════════════════════
       左側跳色直線 + 開關按鈕 (水藍)
    ══════════════════════════════════════ */
    .edge-line {
      position: fixed; top: 0; bottom: 0; left: 0; width: 4px;
      background-color: var(--theme-color); z-index: 998;
      box-shadow: 0 0 6px rgba(95,195,255,0.5);
    }
    .my-toggle-btn {
      position: fixed; top: 20%; transform: translateY(-50%);
      left: var(--my-sidebar-width); width: 26px; height: 48px;
      background-color: var(--theme-color); color: #00141f;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: bold; cursor: pointer;
      z-index: 1001; border-radius: 0 10px 10px 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
      user-select: none;
    }
    .my-toggle-btn:hover { background-color: var(--theme-light); color: #000; }
    .my-toggle-btn:active { background-color: var(--theme-deep); }
    body.my-sidebar-closed .my-toggle-btn { left: 4px; }

    /* ══════════════════════════════════════
       浮動標籤導航列 (淡水藍按鈕風格)
    ══════════════════════════════════════ */
    .floating-toc {
      position: sticky; top: 0; z-index: 150;
      display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 0;
      background: rgba(0, 8, 12, 0.96); backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f4a66; margin-bottom: 24px; margin-top: -15px;
      border-radius: 0 0 8px 8px;
    }
    .floating-toc button {
      background: #0f1f2b; color: var(--theme-color); border: 1px solid #2c6b8f;
      padding: 6px 16px; border-radius: 40px; font-size: 14px;
      cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
      font-weight: 500;
    }
    .floating-toc button:hover {
      background: var(--theme-color); color: #02121c; border-color: var(--theme-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,160,255,0.2);
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      scroll-margin-top: 80px !important;
    }

    /* ══════════════════════════════════════
       底部工具列 — 清爽水藍調
    ══════════════════════════════════════ */
    .markdown-section { font-size: var(--base-font-size) !important; padding-bottom: calc(var(--toolbar-height) + 24px) !important; }
    .bottom-toolbar {
      position: fixed; bottom: 0; right: 0; height: var(--toolbar-height); z-index: 200;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      background: rgba(3, 15, 22, 0.98); border-top: 1px solid #1f5a78; backdrop-filter: blur(8px);
      box-sizing: border-box; gap: 12px;
    }
    .toolbar-nav, .toolbar-font { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .bottom-toolbar button {
      background: #0d202b; color: var(--theme-color); border: 1px solid #2f6e92;
      padding: 6px 14px; cursor: pointer; border-radius: 32px; font-size: 13px;
      transition: 0.2s; white-space: nowrap; flex-shrink: 0; font-weight: 500;
    }
    .bottom-toolbar button:hover {
      background: var(--theme-color); color: #021824; border-color: var(--theme-light);
      box-shadow: 0 2px 6px rgba(95,195,255,0.3);
    }

    /* 側邊欄折疊箭頭保持風格 */
    .sidebar-nav li:not(.collapse) > .section-link:after { content: '▼'; font-size: 10px; margin-left: 5px; color: var(--theme-color); }
    .sidebar-nav li.collapse > .section-link:after { content: '▶'; color: var(--base-color); }
    
    /* 自定義卷軸（淡藍細節） */
    ::-webkit-scrollbar { width: 8px; background: #030e14; }
    ::-webkit-scrollbar-thumb { background: #2f6e92; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--theme-color); }
  </style>
</head>
<body>

  <div class="edge-line"></div>
  <div id="my-toggle-btn" class="my-toggle-btn" onclick="toggleMySidebar()">◀</div>

  <div id="app">載入中⋯</div>

  <div class="bottom-toolbar">
    <div class="toolbar-nav">
      <button onclick="goPrevPage()" title="上一篇">◀ 上一篇</button>
      <button onclick="goNextPage()" title="下一篇">下一篇 ▶</button>
    </div>
    <div class="toolbar-font">
      <button onclick="changeFontSize(-2)" title="縮小文字">A−</button>
      <button onclick="resetFontSize()"    title="重置字體">重置</button>
      <button onclick="changeFontSize(2)"  title="放大文字">A+</button>
    </div>
  </div>

  <script>
    function toggleMySidebar() {
      const body = document.body;
      const btn = document.getElementById('my-toggle-btn');
      if (body.classList.contains('my-sidebar-closed')) {
        body.classList.remove('my-sidebar-closed');
        btn.innerHTML = '◀'; 
      } else {
        body.classList.add('my-sidebar-closed');
        btn.innerHTML = '▶'; 
      }
    }

    if (window.innerWidth <= 768) {
      document.body.classList.add('my-sidebar-closed');
      document.getElementById('my-toggle-btn').innerHTML = '▶';
    }

    window.$docsify = {
      name: '《阿含經》白話計畫 · 水藍映照',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      markdown: { gfm: true, breaks: true },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            // 保留原有加粗處理，無金色殘留
            return content.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
          });
          hook.doneEach(function() {
            setTimeout(() => {
              window.scrollTo(0, 0);
              document.body.scrollTop = 0;
              document.documentElement.scrollTop = 0;
              const mainContent = document.querySelector('.content');
              if (mainContent) mainContent.scrollTop = 0;
            }, 50);
            setTimeout(() => {
              window.scrollTo(0, 0);
              document.body.scrollTop = 0;
              document.documentElement.scrollTop = 0;
            }, 300);

            // 浮動目錄：從 h3 產生淡水藍色快速跳轉鈕（對應「###」直覺）
            const h3s = document.querySelectorAll('.markdown-section h3');
            if (h3s.length > 0) {
              const oldToc = document.getElementById('floating-toc');
              if (oldToc) oldToc.remove();

              const tocContainer = document.createElement('div');
              tocContainer.id = 'floating-toc';
              tocContainer.className = 'floating-toc';

              h3s.forEach(h3 => {
                const btn = document.createElement('button');
                btn.innerText = h3.innerText.replace(/[#]/g, '').trim();
                btn.onclick = () => { h3.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
                tocContainer.appendChild(btn);
              });

              const markdownSection = document.querySelector('.markdown-section');
              if (markdownSection) markdownSection.insertBefore(tocContainer, markdownSection.firstChild);
            }
          });
        }
      ],
      search: { maxAge: 86400000, paths: 'auto', placeholder: '🔍 搜尋經文（淡水藍光）...', noData: '📖 無相關經句', depth: 6 },
      tabs: { persist: true, sync: false, theme: 'classic', tabComments: true, tabHeadings: true }
    };

    // 字體大小控制
    let currentSize = parseInt(localStorage.getItem('agama-font-size')) || 18;
    applyFontSize(currentSize);
    function changeFontSize(delta) {
      currentSize = Math.min(40, Math.max(12, currentSize + delta));
      applyFontSize(currentSize);
      localStorage.setItem('agama-font-size', currentSize);
    }
    function resetFontSize() {
      currentSize = 18;
      applyFontSize(currentSize);
      localStorage.removeItem('agama-font-size');
    }
    function applyFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', size + 'px');
    }

    // 上一篇 / 下一篇 路徑擷取 (保留manifest邏輯)
    let _sidebarPaths = null; 
    async function fetchSidebarPaths() {
      if (_sidebarPaths) return _sidebarPaths;
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();

        const paths = [];
        data.forEach(vol => {
          if (vol.items) {
            vol.items.forEach(item => {
              const clean = item.path.replace(/^\.?\//, '').replace(/\.md$/, '');
              paths.push(clean);
            });
          }
        });
        _sidebarPaths = paths;
        return paths;
      } catch (e) {
        console.warn('無法讀取 manifest.json', e);
        return [];
      }
    }

    function getCurrentPath() {
      return location.hash.replace(/^#\//, '').replace(/\.md$/, '');
    }

    async function goNextPage() {
      const paths = await fetchSidebarPaths();
      const current = getCurrentPath();
      const idx = paths.indexOf(current);
      if (idx !== -1 && idx < paths.length - 1) {
        location.hash = '#/' + paths[idx + 1];
      } else if (idx === -1 && paths.length > 0) {
        location.hash = '#/' + paths[0]; 
      } else {
        alert('✨ 已是最末篇經文，淡水藍無盡法喜。');
      }
    }

    async function goPrevPage() {
      const paths = await fetchSidebarPaths();
      const current = getCurrentPath();
      const idx = paths.indexOf(current);
      if (idx > 0) {
        location.hash = '#/' + paths[idx - 1];
      } else if (idx === -1 && paths.length > 0) {
        location.hash = '#/' + paths[0]; 
      } else {
        alert('🌟 這已是第一篇經文，智慧起點。');
      }
    }

    window.addEventListener('hashchange', () => { 
      _sidebarPaths = null; 
      setTimeout(() => {
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
      }, 50);
    });
  </script>

  <script src="lib/docsify.min.js"></script>
  <script src="lib/plugins/search.min.js"></script>
  <script src="lib/plugins/docsify-tabs.min.js"></script>
  <script src="lib/plugins/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
